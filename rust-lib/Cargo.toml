[package]
name = "logos_tx_decoder"
version = "1.0.0"
edition = "2021"
description = "Offline EVM calldata decoding against a vendored ABI database — a library for signing surfaces."
rust-version = "1.89"

[workspace]
resolver = "3"

[lib]
name = "logos_tx_decoder"
crate-type = ["staticlib", "rlib"]

[dependencies]
alloy = { version = "1", default-features = false, features = ["std", "dyn-abi", "json-abi"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
