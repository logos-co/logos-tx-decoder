name: Unit tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-lib
      - run: cargo test --manifest-path rust-lib/Cargo.toml --locked
      - name: Keep the swap reading and the test floor present
        run: |
          out=$(cargo test --manifest-path rust-lib/Cargo.toml --locked -- --list)
          for t in ffi::tests::a_router_swap_reads_as_what_it_does_for_the_account_signing \
                   ffi::tests::both_surfaces_read_a_request_the_same_way \
                   router::tests::the_same_call_to_an_unknown_address_is_not_read; do
            echo "$out" | grep -q "^$t: test$" || { echo "MISSING: $t"; exit 1; }
          done
          n=$(echo "$out" | grep -c ': test$')
          echo "tests: $n"; [ "$n" -ge 76 ]
